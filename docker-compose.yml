
services:
  student-web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: student-web
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      student-db:
        condition: service_healthy
    networks:
      - student-network

  student-db:
    image: mysql:8.0
    container_name: student-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - student-db-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - student-network

  student-nginx:
    image: nginx:alpine
    container_name: student-nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - student-web
    networks:
      - student-network

  student-prometheus:
    image: prom/prometheus:latest
    container_name: student-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - student-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - student-network

  student-grafana:
    image: grafana/grafana:latest
    container_name: student-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - student-grafana-data:/var/lib/grafana
    depends_on:
      - student-prometheus
    networks:
      - student-network


  student-loki:
    image: grafana/loki:2.9.2
    container_name: student-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3101:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - student-loki-data:/loki
    networks:
      - student-network

  student-promtail:
    image: grafana/promtail:2.9.2
    container_name: student-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers/f708bafa239bbf8b123099559d2b76e3687281d362fd398430fa74351644116c:/var/log/student-web:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - student-loki
      - student-web
    networks:
      - student-network

networks:
  student-network:
    driver: bridge

volumes:
  student-db-data:
  student-prometheus-data:
  student-grafana-data:
  student-loki-data:
