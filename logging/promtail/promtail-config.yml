
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://student-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: student-management
    static_configs:
      - targets:
          - localhost
        labels:
          job: student-management
          app: student-web
          __path__: /var/log/student-web/*.log

